<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RADPOCKET"><title>RADPOCKET</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}.hero{background:#111827;color:#fff;padding:30px 18px 20px;padding-top:calc(30px + env(safe-area-inset-top))}.logo{font-size:30px;font-weight:800}.tag{color:#cbd5e1;margin-top:5px}.search{margin-top:18px;background:#fff;color:#64748b;border-radius:15px;padding:14px}.main{padding:18px}.section{margin:18px 0 10px;color:#64748b;font-size:12px;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #e5e7eb;border-radius:17px;padding:15px;background:#fff;text-align:left;min-height:86px}.card b{display:block;font-size:17px}.card small{display:block;color:#64748b;margin-top:5px}.hidden{display:none!important}.back{border:0;background:none;padding:0;margin-bottom:12px;color:#334155;font-weight:700}.crumb{font-size:12px;color:#64748b}.title{font-size:29px;margin:4px 0 14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.tab{white-space:nowrap;border:1px solid #dbe1e8;border-radius:999px;background:#fff;padding:8px 12px;font-weight:700}.active{background:#111827;color:#fff}.block{border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin:10px 0}.block h3{margin:0 0 9px}.block p{line-height:1.5}.block li{line-height:1.55}.quick{background:#eef2ff}.eye{background:#f0fdf4}.warn{background:#fff7ed}.pill{display:inline-block;border:1px solid #dbe1e8;border-radius:999px;padding:7px 10px;margin:3px;background:#fff;font-size:13px;font-weight:700}.footer{padding:18px;color:#64748b;font-size:11px;line-height:1.5;border-top:1px solid #e5e7eb}
</style></head><body><div class="app"><header class="hero"><div class="logo">RADPOCKET</div><div class="tag">Emergency Radiography • v0.6</div><div class="search">🔎 Search examinations or presentations</div></header><main id="home" class="main">
<div class="section">START WITH THE EXAMINATION</div><div class="grid">
<button class="card" onclick="exam('Ankle',['AP • Mortise • Lateral'],'Malleolar fracture, talar injury, mortise widening, proximal fibular injury')"><b>🦴 Ankle</b><small>AP • Mortise • Lateral</small></button>
<button class="card" onclick="exam('Shoulder',['AP • Rotation • Y / Axillary'],'Dislocation, proximal humeral fracture, greater tuberosity, AC/clavicle injury')"><b>💪 Shoulder</b><small>AP • Rotation • Trauma</small></button>
<button class="card"><b>💪 Elbow</b><small>Coming next</small></button>
<button class="card" onclick="exam('Wrist',['PA/DP • Lateral • Oblique • Scaphoid'],'Scaphoid injury, carpal malalignment, distal radius fracture, DRUJ abnormality')"><b>🖐️ Wrist</b><small>PA/DP • Lateral • Oblique</small></button>
<button class="card"><b>🦴 Hip</b><small>Coming next</small></button>
<button class="card" onclick="exam('Knee',['AP • Lateral • Trauma'],'Patellar fracture, tibial plateau injury, fibular-head injury, dislocation, effusion')"><b>🦵 Knee</b><small>AP • Lateral • Trauma</small></button>
</div>
<div class="section">START WITH THE PATIENT PROBLEM</div><div class="grid">
<button class="card" onclick="problem('FOOSH','Wrist • Scaphoid • Forearm','Distal radius/ulna, carpal alignment, scaphoid, DRUJ')"><b>🖐️ FOOSH</b><small>Fall onto outstretched hand</small></button>
<button class="card" onclick="problem('Unable to weight-bear','Ankle • Foot • Knee • Hip/Pelvis','Alignment, cortical disruption, joints, soft tissues')"><b>🚶 Unable to weight-bear</b><small>Lower-limb trauma</small></button>
<button class="card" onclick="problem('Shoulder trauma','Shoulder • Humerus','Glenohumeral alignment, proximal humerus, AC region, scapula')"><b>💥 Shoulder trauma</b><small>Fall / direct impact</small></button>
<button class="card" onclick="problem('Road traffic trauma','C-spine • Chest • Pelvis • Other regions','Immobilisation, alignment, major fractures, chest complications')"><b>🚗 Road traffic trauma</b><small>Multi-region injury</small></button>
</div><div class="section">QUICK ACCESS</div><div class="grid"><button class="card"><b>🚨 Trauma</b><small>Coming next</small></button><button class="card"><b>📖 Learn</b><small>Coming next</small></button></div>
<div class="footer">Educational/reference prototype. Follow your department's current protocol, scope of practice and clinical governance.</div></main><div id="view" class="main hidden"></div></div>
<script>
function home(){document.getElementById('view').className='main hidden';document.getElementById('home').className='main';scrollTo(0,0)}
function base(title,crumb,body){document.getElementById('home').className='main hidden';let v=document.getElementById('view');v.className='main';v.innerHTML='<button class="back" onclick="home()">← Home</button><div class="crumb">'+crumb+'</div><h1 class="title">'+title+'</h1>'+body+'<div class="footer"><b>RADPOCKET v0.6</b><br>Educational reference only. Not a substitute for local protocols, professional judgement, reporting, or clinical decision-making.</div>';scrollTo(0,0)}
function exam(name,views,dont){base(name+' X-ray','GENERAL X-RAY', '<div class="tabs">'+views.map((x,i)=>'<button class="tab '+(!i?'active':'')+'">'+x+'</button>').join('')+'</div><div class="block quick"><h3>⚡ Quick View</h3><p><b>Check:</b> alignment → cortex → joints → soft tissues → clinical context.</p></div><div class="block"><h3>📍 Positioning</h3><ul><li>Position the patient as safely as the injury allows; do not force painful movement.</li><li>Use the required projections according to local protocol and clinical indication.</li><li>Adapt trauma positioning when the standard position is unsafe or not tolerated.</li></ul></div><div class="block"><h3>🎯 Image evaluation</h3><ul><li>Confirm required anatomy is included.</li><li>Assess alignment, cortical continuity and joint spaces.</li><li>Check rotation and motion artefact.</li><li>Review soft tissues and the entire visible examination.</li></ul></div><div class="block eye"><h3>👁️ Radiographer’s Eye</h3><ul><li>Prioritise patient safety over reproducing a textbook position.</li><li>Do not stop reviewing after finding the obvious abnormality.</li><li>An adequate radiograph does not automatically exclude occult injury.</li></ul></div><div class="block warn"><h3>🚨 Don't Miss</h3><ul>'+dont.split(', ').map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="block"><h3>📚 Protocol note</h3><p>Projection selection and trauma modifications vary between departments. Follow the current local protocol and clinical pathway.</p></div>')}
function problem(title,exams,checks){base(title,'CLINICAL PRESENTATION','<div class="block quick"><h3>🧭 Start here</h3><p>Use the mechanism and clinical findings to guide the appropriate imaging pathway.</p></div><div class="block"><h3>🩻 Relevant examinations</h3>'+exams.split(' • ').map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><div class="block"><h3>🔎 What to check</h3><ul>'+checks.split(', ').map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="block eye"><h3>👁️ Radiographer’s Eye</h3><p>Let the patient's condition guide positioning. Avoid unnecessary movement and adapt the examination where appropriate.</p></div>')}
</script></body></html>
